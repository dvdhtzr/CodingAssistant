name: M0.7 Runtime Image Smoke

on:
  pull_request:
    paths:
      - "infra/runtime/**"
      - "tools/m0/runtime_image_probe.py"
      - "tools/m0/pinned_openai.py"
      - "tools/m0/isolated_opencode_models.mjs"
      - "tests/m0_opencode_discovery_smoke.mjs"
      - "tests/m0_opencode_inference_smoke.mjs"
      - "tests/m0_opencode_edit_smoke.mjs"
      - "tools/m0/pinned_real_edit.py"
      - "tools/m0/isolated_real_edit.mjs"
      - "tools/m0/real_opencode_edit_probe.py"
      - "tests/test_real_opencode_edit.py"
      - "tests/m0_real_edit_socket_smoke.py"
      - "tools/m0/qualification_isolation_probe.py"
      - "tools/m0/qualification_fixture_client.mjs"
      - "tests/test_qualification_isolation.py"
      - "tests/m0_qualification_fixture_smoke.py"
      - "infra/qualification/**"
      - "tools/m0/qualification_acceptance_client.mjs"
      - "tools/m0/qualification_acceptance_probe.py"
      - "tests/m0_qualification_acceptance_smoke.py"
      - "tools/m0/pinned_qualification.py"
      - "tools/m0/isolated_qualification_writer.mjs"
      - "tools/m0/real_qualification.py"
      - "tests/test_real_qualification.py"
      - "tests/m0_qualification_native_write_smoke.py"
      - "docs/M0_REAL_QUALIFICATION.md"
      - "tools/m0/qualification_acceptance_client.mjs"
      - "benchmarks/acceptance/**"
      - "benchmarks/tasks.json"
      - "benchmarks/fixtures/01-api-feature/**"
      - "benchmarks/fixtures/03-fullstack-feature/**"
      - "tools/m0/disposable_workspace_client.mjs"
      - "tools/m0/disposable_workspace_probe.py"
      - "tools/m0/workspace_attack_client.mjs"
      - "tools/m0/workspace_negative_probe.py"
      - "tools/m0/controlled_repair_pilot.py"
      - "tools/m0/pinned_repair_proposal.py"
      - "tools/m0/isolated_repair_proposal.mjs"
      - "tools/m0/isolated_repair_evaluator.mjs"
      - "benchmarks/fixtures/02-build-repair/api/**"
      - ".github/workflows/m0-runtime-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    name: Build and check offline toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image using only the runtime recipe directory
        run: docker build --pull --progress=plain -t codingassistant-m0-runtime:ci -f infra/runtime/Containerfile infra/runtime
      - name: Verify toolchain with no network or project mounts
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 96 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user 1001:1001 \
            --env HOME=/tmp --env DOTNET_CLI_HOME=/tmp \
            --env XDG_CONFIG_HOME=/tmp/.config \
            --env XDG_DATA_HOME=/tmp/.local/share \
            --env XDG_CACHE_HOME=/tmp/.cache \
            --env OPENCODE_DISABLE_AUTOUPDATE=1 \
            --workdir /tmp \
            --entrypoint /bin/sh codingassistant-m0-runtime:ci \
            -c 'set -eu; dotnet --version | grep "^10[.]"; node --version | grep "^v22[.]"; npm --version; git --version; opencode --version | grep -E "^(opencode v)?2[.]3[.]0$"; opencode run --help >/dev/null; echo "Offline toolchain smoke PASS"'
      - name: Verify actual OpenCode native two-route discovery offline
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 96 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user 1001:1001 \
            --env HOME=/tmp --env XDG_CONFIG_HOME=/tmp/.config \
            --env XDG_DATA_HOME=/tmp/.local/share \
            --env XDG_CACHE_HOME=/tmp/.cache \
            --env OPENCODE_DISABLE_AUTOUPDATE=1 \
            --workdir /tmp \
            --entrypoint node codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tests/m0_opencode_discovery_smoke.mjs)"
      - name: Verify actual OpenCode OpenAI streaming request offline (no tools)
        run: |
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 96 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user 1001:1001 \
            --env HOME=/tmp --env XDG_CONFIG_HOME=/tmp/.config \
            --env XDG_DATA_HOME=/tmp/.local/share \
            --env XDG_CACHE_HOME=/tmp/.cache \
            --env OPENCODE_DISABLE_AUTOUPDATE=1 \
            --workdir /tmp \
            --entrypoint node codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tests/m0_opencode_inference_smoke.mjs)"
      - name: Test disposable fixture copy and fixed child-process isolation (no agent)
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/workspace"
          cp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/"
          cp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/"
          printf 'outside-only' > "$tmp/host-sentinel"
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --volume "$tmp/workspace:/workspace:rw" \
            --env HOME=/tmp --workdir /workspace \
            --entrypoint node codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tools/m0/disposable_workspace_client.mjs)" \
            -- "$tmp/host-sentinel"
          test ! -e "$tmp/workspace/.m0-9-fixed-write-check"
          cmp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/Program.cs"
          cmp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/Repair.csproj"
          echo "M0.9 fixed disposable workspace smoke PASS"
      - name: Test M0.10 prohibited writes, links, child and Git access (no agent)
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/workspace"
          cp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/"
          cp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/"
          printf 'outside-only' > "$tmp/host-sentinel"
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --volume "$tmp/workspace:/workspace:rw" \
            --env HOME=/tmp --workdir /workspace \
            --entrypoint node codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tools/m0/workspace_attack_client.mjs)" \
            -- "$tmp/host-sentinel"
          test "$(find "$tmp/workspace" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          cmp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/Program.cs"
          cmp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/Repair.csproj"
          test "$(cat "$tmp/host-sentinel")" = 'outside-only'
          echo "M0.10 deterministic workspace denial smoke PASS"
      - name: Verify fixed offline dotnet evaluator on disposable known-good fixture
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/workspace"
          cp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/"
          cp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/"
          # CI fixture uses a static known-good code correction, NOT model output.
          sed -i 's/values.Summ()/values.Sum()/' "$tmp/workspace/Program.cs"
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user "$(id -u):$(id -g)" \
            --volume "$tmp/workspace:/workspace:rw" \
            --env HOME=/tmp --env DOTNET_CLI_HOME=/tmp \
            --workdir /workspace --entrypoint node \
            codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tools/m0/isolated_repair_evaluator.mjs)"
          cmp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/Repair.csproj"
          test ! -e "$tmp/workspace/.git"
          echo "M0.11 static known-good offline evaluator smoke PASS"
      - name: Verify native OpenCode edit tool on disposable C# fixture (deterministic mock)
        run: |
          set -eu
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/workspace"
          cp benchmarks/fixtures/02-build-repair/api/Program.cs "$tmp/workspace/"
          cp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/"
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 96 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user "$(id -u):$(id -g)" \
            --volume "$tmp/workspace:/workspace:rw" \
            --env HOME=/tmp --workdir /workspace \
            --entrypoint node codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tests/m0_opencode_edit_smoke.mjs)"
          sed 's/values.Summ()/values.Sum()/' \
            benchmarks/fixtures/02-build-repair/api/Program.cs | cmp - "$tmp/workspace/Program.cs"
          cmp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/Repair.csproj"
          test "$(find "$tmp/workspace" -mindepth 1 -maxdepth 1 | wc -l)" -eq 2
          # Verification runs independently with no model endpoint or socket.
          docker run --rm --pull never --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 64 --memory 2g \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            --user "$(id -u):$(id -g)" \
            --volume "$tmp/workspace:/workspace:rw" \
            --env HOME=/tmp --env DOTNET_CLI_HOME=/tmp \
            --workdir /workspace --entrypoint node \
            codingassistant-m0-runtime:ci \
            --input-type=module --eval "$(cat tools/m0/isolated_repair_evaluator.mjs)"
          cmp benchmarks/fixtures/02-build-repair/api/Repair.csproj "$tmp/workspace/Repair.csproj"
          test ! -e "$tmp/workspace/.git"
          echo "M0.12 deterministic native OpenCode edit and independent C# verification PASS"
      - name: M0.13 syntax-check real Qwen isolated edit client (NO model)
        run: |
          node --check tools/m0/isolated_real_edit.mjs
          python3 -m py_compile tools/m0/pinned_real_edit.py tools/m0/real_opencode_edit_probe.py
          echo "M0.13 real-model client and broker syntax PASS (no inference)"
      - name: M0.13 real broker, Unix socket and native OpenCode edit smoke (MOCK Qwen)
        run: |
          python3 tests/m0_real_edit_socket_smoke.py --image codingassistant-m0-runtime:ci
      - name: M0.14 prove each frozen qualification task is OS-isolated (NO MODEL)
        run: |
          node --check tools/m0/qualification_fixture_client.mjs
          python3 -m py_compile tools/m0/qualification_isolation_probe.py
          python3 tests/m0_qualification_fixture_smoke.py --image codingassistant-m0-runtime:ci
      - name: M0.15 build trusted offline full-stack acceptance image
        run: |
          docker build --pull=false --progress=plain \
            --build-arg BASE_IMAGE=codingassistant-m0-runtime:ci \
            -t codingassistant-m0-qualification:ci \
            -f infra/qualification/Containerfile .
      - name: M0.15 independently verify C# API, repair and React (NO MODEL)
        run: |
          node --check tools/m0/qualification_acceptance_client.mjs
          python3 -m py_compile tools/m0/qualification_acceptance_probe.py
          python3 tests/m0_qualification_acceptance_smoke.py \
            --image codingassistant-m0-qualification:ci
      - name: M0.16 OpenCode native writing through mocked Qwen on ALL frozen tasks
        run: |
          node --check tools/m0/isolated_qualification_writer.mjs
          python3 -m py_compile tools/m0/pinned_qualification.py tools/m0/real_qualification.py
          python3 tests/m0_qualification_native_write_smoke.py \
            --runtime-image codingassistant-m0-runtime:ci \
            --evaluation-image codingassistant-m0-qualification:ci
      # The discovery contract exercises the actual OpenCode CLI against a
      # deterministic loopback-only mock, without host Ollama or code execution.
      # GitHub-hosted Docker smoke establishes package startup only.
      # The actual rootless Podman/host isolation gate still runs on Dell.
