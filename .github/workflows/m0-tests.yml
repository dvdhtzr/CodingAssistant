name: M0 Model-Free Checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    name: Python M0 checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Node.js for pinned gateway plugin syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check M1 Gateway plugins and runner (no execution)
        run: |
          node --check infra/m1/coding-runner.mjs
          node --check infra/m1/coding-plugin/index.mjs
          node --check infra/m1/coding-plugin/task-contract.mjs
          node --check infra/m1/coding-plugin/safe-failure.mjs
          node --check infra/m1/doctor-plugin/index.mjs
          node --check tools/m4/windows_docker_guest.mjs
          node --check tools/m4/windows_docker_qualification.mjs
          node --check tools/m4/windows_scoped_workspace_guest.mjs
          node --check tools/m4/windows_scoped_workspace_qualification.mjs
          node --check tools/m4/windows_calculator_evaluator_guest.mjs
          node --check tools/m4/windows_calculator_harness.js
          node --check tools/m4/windows_calculator_evaluator_qualification.mjs
          node --check tools/m4/windows_chromium_sandbox_guest.mjs
          node --check tools/m4/windows_chromium_sandbox_qualification.mjs
          node --check tools/m4/generated_zip_smoke_guest.mjs
          node --check tools/m4/smoke_generated_zip.mjs
      - name: Execute M1 ACP typed-error classifier security tests (no agent/model)
        run: node --test tests/test_m1_safe_acp_failure.mjs tests/test_m1_task_contract.mjs tests/test_m4_windows_docker_qualification.mjs tests/test_m4_windows_scoped_workspace.mjs tests/test_m4_windows_calculator_evaluator.mjs tests/test_m4_windows_chromium_sandbox.mjs tests/test_m4_generated_zip_smoke.mjs tests/test_m4_aet8_trusted_qualification.mjs
      - name: Compile Python tools
        run: python -m compileall -q tools/m0 tools/m1 tools/m2 tools/m3 tools/m4 tools/mvp benchmarks/acceptance tests
      - name: Model-free tests
        run: python -m unittest discover -s tests -v
      - name: Verify Windows launcher token generation (PowerShell 5.1, no secrets logged)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/Verify-WindowsLauncher.ps1
      - name: Build same-origin React Mission Control (no model)
        working-directory: src/CodingAssistant.Web
        run: |
          npm install --no-audit --no-fund
          npm run test:workbench
          npm run build
      # UX-6C: trusted fixed-fixture Chromium interactions on BOTH OSes.
      # Neither runner executes arbitrary model-generated application source.
      - name: Install Chromium browser for trusted fixtures (Linux)
        if: runner.os == 'Linux'
        working-directory: src/CodingAssistant.Web
        run: npx playwright install --with-deps chromium
      - name: Install Chromium browser for trusted fixtures (Windows)
        if: runner.os == 'Windows'
        working-directory: src/CodingAssistant.Web
        run: npx playwright install chromium
      - name: Real Chromium Mission Control and Calculation Journal fixture tests
        working-directory: src/CodingAssistant.Web
        run: npm run test:browser
      - name: Check Windows Docker readiness probe remains non-executing by default
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/Verify-WindowsStaticWebDoctor.ps1
      - name: Install .NET 10 SDK for local control-plane checks
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and exercise actual M2 HTTP/SQLite API (no model)
        run: dotnet run --configuration Release --project tests/CodingAssistant.Api.Smoke/CodingAssistant.Api.Smoke.csproj
      - name: Verify read-only Code Atlas graph indexing (no model or executor)
        run: dotnet run --configuration Release --project tests/CodingAssistant.CodeAtlas.Smoke/CodingAssistant.CodeAtlas.Smoke.csproj
      - name: Verify Phase 2 runtime profiles and decision persistence (no model or executor)
        run: dotnet run --configuration Release --project tests/CodingAssistant.Phase2.Smoke/CodingAssistant.Phase2.Smoke.csproj
      - name: Publish self-contained Dell-ready Linux-x64 API
        if: runner.os == 'Linux'
        run: dotnet publish src/CodingAssistant.Api/CodingAssistant.Api.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output ${{ runner.temp }}/codingassistant-linux-x64
      - name: Attach portable API for explicit Dell acceptance
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: codingassistant-linux-x64
          path: ${{ runner.temp }}/codingassistant-linux-x64/
          retention-days: 7

  publish-local-preview:
    # Never distribute a package until *both* OS CI jobs passed. A public,
    # immutable-commit GitHub Release avoids expiring, login-gated Actions ZIPs.
    name: Publish verified Linux app for one-command startup
    # A GitHub App/API squash merge may not emit a follow-up push workflow.
    # The merged pull_request closed event is an independent publication
    # trigger. Only merge commits from this repository can publish.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: unit-and-syntax
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Linux application from this workflow
        uses: actions/download-artifact@v4
        with:
          name: codingassistant-linux-x64
          path: ${{ runner.temp }}/codingassistant-package
      - name: Package with checksum (no LLM or model)
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ runner.temp }}/codingassistant-package/CodingAssistant.Api"
          test -f "${{ runner.temp }}/codingassistant-package/wwwroot/index.html"
          cd "${{ runner.temp }}/codingassistant-package"
          zip -q -r "${{ runner.temp }}/codingassistant-linux-x64.zip" .
          cd "${{ runner.temp }}"
          sha256sum codingassistant-linux-x64.zip > codingassistant-linux-x64.zip.sha256
      - name: Publish commit-pinned official GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="m3-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This exact commit was already published."
          else
            gh release create "$tag" \
              "${{ runner.temp }}/codingassistant-linux-x64.zip" \
              "${{ runner.temp }}/codingassistant-linux-x64.zip.sha256" \
              --target "$GITHUB_SHA" --latest \
              --title "Mission Control — verified Linux build ${GITHUB_SHA:0:12}" \
              --notes "M3 Linux x64 self-contained API and React UI. Published only after Ubuntu and Windows model-free CI passed. This is development preview software; M1 integrated adversarial security qualification remains outstanding."
          fi
