name: M0 Model-Free Checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-syntax:
    name: Python M0 checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python tools
        run: python -m compileall -q tools/m0 benchmarks/acceptance tests
      - name: Model-free tests
        run: python -m unittest discover -s tests -v
